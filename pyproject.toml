[project]
name = "dataforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Firdaus Attalea", email = "firdausattalea01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "duckdb>=1.5.6",
    "fastapi>=0.146.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pydantic[email]>=2.14.1",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
